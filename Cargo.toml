[workspace]
members = [
    ".",
    "guest",
]

[package]
name = "wasmee"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmtime = "22.0.0"
tokio = { version = "1.36", features = ["full"] }
axum = "0.7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
prost = "0.12"
sha2 = "0.10"

[build-dependencies]
prost-build = "0.12"


