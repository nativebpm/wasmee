[workspace]
members = [
    ".",
    "guest",
    "examples/guest_custom",
    "examples/dota-arena/guest",
]

[package]
name = "wasmee"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmtime = "22.0.0"
tokio = { version = "1.36", features = ["full"] }
axum = "0.7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
prost = "0.12"
sha2 = "0.10"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "tokio-rustls"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
flate2 = "1.0"
brotli = "6.0"
tower-http = { version = "0.5.0", features = ["cors", "compression-gzip", "compression-br", "decompression-gzip", "decompression-br"] }

[build-dependencies]
prost-build = "0.12"


